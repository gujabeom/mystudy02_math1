<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<title>수학Ⅰ 개념 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="style.css?v=a40d90d7">
</head>
<body>
<main id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-card" autocomplete="off">
    <h1>수학Ⅰ 개념 노트</h1>
    <p class="muted">선생님께 받은 비밀번호를 입력하세요.</p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <label class="check"><input id="remember" type="checkbox" checked> 이 기기에서 기억</label>
    <button id="unlockBtn" type="submit">열기</button>
    <p id="lockMsg" class="error" role="alert"></p>
  </form>
</main>
<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <a href="#/" class="brand"><h1>수학Ⅰ 개념 노트</h1></a>
      <nav class="top-links">
        <a href="#/ask">질문하기</a>
      </nav>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer class="foot muted small">
    <span id="builtAt"></span>
    <button id="lockBtn" type="button" class="linkish" hidden>잠그기</button>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="app.js?v=cbb84877"></script>
</body>
</html>
